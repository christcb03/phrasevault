---
# PVFS build/test/deploy pipeline.
#
# Stages (tags): prepare → deploy → build → test → smoke → install → daemon → report
#
#   ansible-playbook -i inventory.ini pipeline.yml
#   ansible-playbook -i inventory.ini pipeline.yml --tags test,smoke   # re-run checks only
#
# Run it from your session's worktree with `-e session=<name>` so the build
# host gives that session its own source tree (/opt/pvfs-<name>/src) instead
# of sharing one slot with every other concurrent run — see `pvfs_root` below.
#
#   ansible-playbook -i inventory.ini pipeline.yml -e session=d99-my-change
#
# The pipeline FAILS if `cargo test` fails or any CLI smoke test fails.
# Test logs are fetched back to ./artifacts/<host>/ on the control machine.

- name: PVFS pipeline — build, test, deploy
  hosts: "{{ target_hosts | default('pvfs_hosts') }}"
  gather_facts: true

  vars:
    # A SESSION'S OWN BUILD SLOT. Pass `-e session=<name>` and this run gets
    # /opt/pvfs-<name> to itself. Without it, concurrent sessions rsync into
    # the one directory with `delete: true`, so one run's source is replaced
    # under another run's compiler. The errors that produces look impossible
    # — a field the file plainly has, reported missing — and cost hours before
    # the cause is even guessed. PVOS hit exactly this (2026-08-16) and fixed
    # it this way; CLAUDE.md tells every session to pass the variable.
    #
    # The install/daemon stages deliberately get NO per-session slot:
    # /usr/local/bin/pvfs, ~/.local/bin and the pvfsd@ user unit are
    # machine-global, and there is only one of each on the host.
    pvfs_root: "/opt/pvfs{{ ('-' + session) if session is defined else '' }}"
    pvfs_src: "{{ pvfs_root }}/src"
    # D100 — the results files get the SAME namespacing as the source tree.
    # Giving each session its own /opt slot while every run still tee'd into
    # one /tmp/pvfs-test-results.txt left the hazard one directory over: the
    # totals are what a run is VERIFIED by, so two sessions could read each
    # other's numbers and both call themselves green.
    pvfs_suffix: "{{ ('-' + session) if session is defined else '' }}"
    test_results: "/tmp/pvfs-test-results{{ pvfs_suffix }}.txt"
    clippy_results: "/tmp/pvfs-clippy-results{{ pvfs_suffix }}.txt"
    smoke_results: "/tmp/pvfs-smoke-results{{ pvfs_suffix }}.txt"
    smoke_script: "/tmp/pvfs-smoke-test{{ pvfs_suffix }}.sh"
    # How idle a build slot must be before the pipeline reclaims it (D121).
    reap_after_days: 2
    pvfs_bin: /usr/local/bin/pvfs
    pvfs_user_bin: "{{ ansible_facts.env.HOME }}/.local/bin"
    # The systemd user-service stage (tag: daemon) — INSTALL.md Option C, automated.
    daemon_forest: smoke
    daemon_mount: "{{ ansible_facts.env.HOME }}/pvfs-mounts/{{ daemon_forest }}"
    cargo_env:
      PATH: "{{ ansible_facts.env.HOME }}/.cargo/bin:{{ ansible_facts.env.PATH }}"
      CARGO_TERM_COLOR: never
      # D100 — stamped into --version by crates/pvfs-cli/build.rs. Empty until
      # the task above runs, and build.rs falls back rather than failing.
      PVFS_BUILD: "{{ build_describe.stdout | default('', true) | trim }}"
    # systemctl --user over ssh needs the user manager's runtime dir + bus.
    user_systemd_env:
      XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.user_uid }}"
      DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts.user_uid }}/bus"

  tasks:
    # ---- prepare ------------------------------------------------------------
    - name: Install build prerequisites
      become: true
      ansible.builtin.apt:
        # libdbus-1-dev: the Linux secret-service backend of pvfs-companion
        # (feature os-keychain) links against libdbus at build time.
        # fuse3: fusermount3 for the P7.3 streaming mount (doc 20 §3)
        name: [build-essential, pkg-config, curl, git, rsync, python3, libdbus-1-dev, fuse3]
        state: present
        update_cache: true
      tags: [prepare]

    - name: Check for rustup
      ansible.builtin.stat:
        path: "{{ ansible_facts.env.HOME }}/.cargo/bin/cargo"
      register: cargo_stat
      tags: [prepare]

    # D100 — PINNED, and pinned to the SAME version .github/workflows/ci.yml
    # uses. Floating on `stable` here meant the build host could run a newer
    # rustc and clippy than CI: a change passes on presubuntu and fails on
    # GitHub, in the direction that wastes the most time. CI's own comment
    # says why it stopped floating; the pipeline never got the message.
    - name: Install Rust toolchain (rustup, 1.96.0 — matches CI)
      ansible.builtin.shell: |
        set -o pipefail
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
          | sh -s -- -y --default-toolchain 1.96.0 --profile minimal
      args:
        executable: /bin/bash
      when: not cargo_stat.stat.exists
      tags: [prepare]

    # ---- deploy ---------------------------------------------------------------
    - name: Create source directory
      become: true
      ansible.builtin.file:
        path: "{{ pvfs_src }}"
        state: directory
        owner: "{{ ansible_facts.user_id }}"
        mode: "0755"
      tags: [deploy]

    - name: Sync repository to {{ pvfs_src }}
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../../"
        dest: "{{ pvfs_src }}/"
        delete: true
        rsync_opts:
          # D91 — decide by CONTENT and stamp with the copy time. rsync's
          # default (-a keeps mtimes) let a freshly-synced file land with an
          # mtime OLDER than cargo's recorded build, so cargo called the crate
          # fresh and tested a STALE binary while reporting success. Caught
          # 2026-08-30: the run said `p1_storage: 11 passed` against a tree
          # holding 12 tests, and two new regression tests never executed —
          # exit code 0 throughout. Not clock skew; the hosts agree within 2s.
          # PVOS fixed this same class already; PVFS never got it.
          - "--checksum"
          - "--no-times"
          - "--exclude=.git"
          - "--exclude=old/"
          - "--exclude=v0.0-concept/"
          - "--exclude=target/"
          - "--exclude=.pvfs/"
          - "--exclude=artifacts/"
          # Other sessions' git worktrees live under .claude/worktrees/ —
          # whole extra copies of this repo. Syncing them wastes gigabytes on
          # the target and puts a second copy of every crate under the build
          # tree, which is confusing at best. Nothing under .claude/ is
          # tracked or needed to build.
          - "--exclude=.claude/"
      tags: [deploy]

    # D100 — the build's identity, taken HERE. The source that reaches the
    # build host has no .git (see the rsync excludes), so `git describe` there
    # returns nothing and every pipeline binary would stamp itself "unknown" —
    # useless on precisely the builds that get deployed. VERSIONING.md made
    # this a rule after 1.4.0 meant two different binaries at once.
    - name: Resolve the build identity from the control machine's checkout
      delegate_to: localhost
      become: false
      changed_when: false
      failed_when: false
      ansible.builtin.command:
        cmd: git describe --tags --always --dirty
        chdir: "{{ playbook_dir }}/../.."
      register: build_describe
      tags: [build]

    # ---- build ------------------------------------------------------------------
    - name: Build (release)
      ansible.builtin.command:
        cmd: cargo build --release --workspace
        chdir: "{{ pvfs_src }}"
      environment: "{{ cargo_env }}"
      register: build_out
      changed_when: true
      tags: [build]

    # ---- test (cargo unit + integration suite, spec §14) -------------------------
    - name: Run cargo test suite
      ansible.builtin.shell: |
        set -o pipefail
        cargo test --workspace 2>&1 | tee {{ test_results }}
      args:
        chdir: "{{ pvfs_src }}"
        executable: /bin/bash
      environment: "{{ cargo_env }}"
      register: test_out
      changed_when: false
      tags: [test]

    # ---- lint (D121) -------------------------------------------------------
    # CLIPPY IS PART OF THE PIPELINE NOW.
    #
    # It was an ad-hoc step CLAUDE.md asked for after a deploy, and being
    # ad-hoc it got skipped: D114 reached PRODUCTION with a `type_complexity`
    # error in it, and D120 was green on 512 tests while carrying five
    # `unused_mut` errors. `cargo test` does not lint, so "the pipeline passed"
    # has twice meant less than it sounded like. A check a human has to
    # remember is a check that eventually does not happen.
    #
    # `--all-targets` because both misses were in TEST code, which a bare
    # `cargo clippy` never compiles.
    # D125 — the component is not part of `--profile minimal`, and nothing
    # installed it: the first host beyond presubuntu (pvos-test) failed the
    # stage with "cargo-clippy is not installed", so D121's "run it every
    # time" was true on one box. Idempotent and apt-free, so it lives here
    # rather than in `prepare`.
    - name: Ensure clippy is installed for the active toolchain
      ansible.builtin.shell: |
        set -o pipefail
        rustup component add clippy 2>&1 | tail -1
      args:
        executable: /bin/bash
      environment: "{{ cargo_env }}"
      register: clippy_component
      changed_when: "'is up to date' not in clippy_component.stdout"
      tags: [test, lint]

    - name: Clippy (-D warnings, all targets)
      ansible.builtin.shell: |
        set -o pipefail
        cargo clippy --all-targets --workspace -- -D warnings 2>&1 | tee {{ clippy_results }}
      args:
        chdir: "{{ pvfs_src }}"
        executable: /bin/bash
      environment: "{{ cargo_env }}"
      register: clippy_out
      changed_when: false
      tags: [test, lint]

    # ---- smoke (every CLI function end-to-end) ------------------------------------
    - name: Upload CLI smoke test
      ansible.builtin.copy:
        src: files/smoke-test.sh
        dest: "{{ smoke_script }}"
        mode: "0755"
      tags: [smoke]

    - name: Run CLI smoke tests
      ansible.builtin.shell: |
        set -o pipefail
        PVFS_BIN={{ pvfs_src }}/target/release/pvfs {{ smoke_script }} 2>&1 \
          | tee {{ smoke_results }}
      args:
        executable: /bin/bash
      register: smoke_out
      changed_when: false
      tags: [smoke]

    # ---- install -------------------------------------------------------------------
    - name: Install pvfs binary to {{ pvfs_bin }}
      become: true
      ansible.builtin.copy:
        src: "{{ pvfs_src }}/target/release/pvfs"
        dest: "{{ pvfs_bin }}"
        mode: "0755"
        remote_src: true
      tags: [install]

    - name: Verify installed binary runs
      ansible.builtin.command: "{{ pvfs_bin }} --version"
      register: version_out
      changed_when: false
      tags: [install]


    # ---- daemon (pvfsd as a systemd user service — INSTALL.md Option C, automated) ----
    # Proves the *service* lifecycle on the target, not just the ad-hoc daemon the
    # smoke suite spawns: install → enable → socket up in /run/pvfs → answers a
    # client → clean stop (socket removed, doc 08 §4 item 4) → restart. The test
    # forest lives in ~/pvfs-mounts/<name>; the service is left enabled + running
    # so the host doubles as a standing daemon testbed.
    - name: Ensure user bin / unit / mount directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ pvfs_user_bin }}"
        - "{{ ansible_facts.env.HOME }}/.config/systemd/user"
        - "{{ daemon_mount }}"
      tags: [daemon]

    - name: Install user binaries (the unit runs %h/.local/bin/pvfsd)
      ansible.builtin.copy:
        src: "{{ pvfs_src }}/target/release/{{ item }}"
        dest: "{{ pvfs_user_bin }}/{{ item }}"
        mode: "0755"
        remote_src: true
      loop: [pvfs, pvfsd, pvfs-companion]
      tags: [daemon]

    # D110 — the DAEMON's identity, which is the one that answers "what is this
    # box running?" after a roll. `pvfsd --version` said a bare `pvfsd 1.4.0`
    # until D110, so the only way to tell was to hash the binary.
    #
    # AFTER the install above, not with the `pvfs` check in the install stage:
    # that binary goes to /usr/local/bin while the daemon goes to ~/.local/bin
    # HERE, so asking earlier reads whatever pvfsd the box had before this run.
    # The first version of this check did exactly that and failed against a
    # stale binary while the fresh one sat unbuilt-for two lines below.
    - name: Verify the installed daemon reports its build
      ansible.builtin.command: "{{ pvfs_user_bin }}/pvfsd --version"
      register: pvfsd_version_out
      changed_when: false
      failed_when: false
      tags: [daemon]

    - name: The daemon's build identity is real, not "unknown"
      ansible.builtin.assert:
        that:
          - pvfsd_version_out.rc == 0
          - "'(' in pvfsd_version_out.stdout"
          - "'unknown' not in pvfsd_version_out.stdout"
        fail_msg: >-
          pvfsd reports "{{ pvfsd_version_out.stdout | default('nothing') }}".
          A daemon that cannot name its own build cannot be verified after a
          roll except by hashing the binary — which on the holder is the box
          where that is hardest. Check that PVFS_BUILD reached the build.
        quiet: true
      tags: [daemon]

    - name: Install the shared socket-dir tmpfiles snippet (doc 06 §2)
      become: true
      ansible.builtin.copy:
        src: files/pvfs-tmpfiles.conf
        dest: /etc/tmpfiles.d/pvfs.conf
        mode: "0644"
      tags: [daemon]

    - name: Create /run/pvfs (1777) from the snippet
      become: true
      ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/pvfs.conf
      changed_when: false
      tags: [daemon]

    - name: Enable lingering so the user manager (and pvfsd) survives logout
      become: true
      ansible.builtin.command: loginctl enable-linger {{ ansible_facts.user_id }}
      args:
        creates: "/var/lib/systemd/linger/{{ ansible_facts.user_id }}"
      tags: [daemon]

    - name: Install the pvfsd@ user unit
      ansible.builtin.copy:
        src: files/pvfsd@.service
        dest: "{{ ansible_facts.env.HOME }}/.config/systemd/user/pvfsd@.service"
        mode: "0644"
      tags: [daemon]

    - name: Reload the user systemd manager
      ansible.builtin.systemd:
        scope: user
        daemon_reload: true
      environment: "{{ user_systemd_env }}"
      tags: [daemon]

    # A disposable test forest — its recovery phrase lands in the ansible log,
    # which is fine here; never init a real forest this way.
    - name: Initialize the daemon test forest (first run only)
      ansible.builtin.command:
        cmd: "{{ pvfs_user_bin }}/pvfs forest init --mount {{ daemon_mount }}"
        creates: "{{ daemon_mount }}/.pvfs"
      tags: [daemon]

    - name: Enable and (re)start pvfsd@{{ daemon_forest }}
      ansible.builtin.systemd:
        scope: user
        name: "pvfsd@{{ daemon_forest }}"
        enabled: true
        state: restarted
      environment: "{{ user_systemd_env }}"
      tags: [daemon]

    - name: Daemon answers a client over the shared socket dir
      ansible.builtin.command:
        cmd: "{{ pvfs_user_bin }}/pvfs --json remote --forest {{ daemon_mount }} --anon info"
      environment:
        PVFS_SOCKET_DIR: /run/pvfs
      register: daemon_info
      until: daemon_info.rc == 0
      retries: 10
      delay: 1
      changed_when: false
      tags: [daemon]

    - name: Stop the service (graceful shutdown checkpoints + removes the socket)
      ansible.builtin.systemd:
        scope: user
        name: "pvfsd@{{ daemon_forest }}"
        state: stopped
      environment: "{{ user_systemd_env }}"
      tags: [daemon]

    - name: Client cannot reach a stopped daemon (socket gone)
      ansible.builtin.command:
        cmd: "{{ pvfs_user_bin }}/pvfs --json remote --forest {{ daemon_mount }} --anon info"
      environment:
        PVFS_SOCKET_DIR: /run/pvfs
      register: daemon_down
      failed_when: daemon_down.rc == 0
      changed_when: false
      tags: [daemon]

    - name: Start the daemon again and leave it running
      ansible.builtin.systemd:
        scope: user
        name: "pvfsd@{{ daemon_forest }}"
        state: started
      environment: "{{ user_systemd_env }}"
      tags: [daemon]

    - name: Daemon is back after the restart
      ansible.builtin.command:
        cmd: "{{ pvfs_user_bin }}/pvfs --json remote --forest {{ daemon_mount }} --anon info"
      environment:
        PVFS_SOCKET_DIR: /run/pvfs
      register: daemon_info2
      until: daemon_info2.rc == 0
      retries: 10
      delay: 1
      changed_when: false
      tags: [daemon]

    - name: Capture the daemon journal for the report
      ansible.builtin.shell: |
        journalctl --user -u pvfsd@{{ daemon_forest }} -n 100 --no-pager \
          > /tmp/pvfsd-journal.txt 2>&1 || true
      environment: "{{ user_systemd_env }}"
      changed_when: false
      tags: [daemon]

        # ---- reap (D121) -------------------------------------------------------
    # DELETE THE SLOTS NOBODY IS USING.
    #
    # Each session slot is a full source + target tree, 6-8 GB. CLAUDE.md says
    # to delete yours when the work merges, and that rule has now failed twice
    # in one project: presubuntu hit 96G/96G on 2026-08-16 and 100% again on
    # 2026-09-08, the second time taking the smoke suite down with a disk-space
    # error that looked nothing like one ("declared 12588912 B ... exceeds
    # 105365504 B free"). Doc 24 section 14 item 5 asked for this to be
    # automated; a rule that depends on remembering is not a rule.
    #
    # Conservative on purpose: only slots whose target tree has not been
    # touched in REAP_AFTER_DAYS, never the one this run is using, and never
    # the canonical /opt/pvfs. An old slot is worth 7 GB; a slot someone is
    # mid-build in is worth an afternoon.
    - name: Reap idle build slots
      ansible.builtin.shell: |
        set -o pipefail
        keep="{{ pvfs_root }}"
        reaped=""
        for d in /opt/pvfs-*; do
          [ -d "$d" ] || continue
          [ "$d" = "$keep" ] && continue
          [ "$d" = "/opt/pvfs" ] && continue
          # Anything still being written to is in use, whatever its age.
          if [ -n "$(find "$d" -mindepth 1 -mmin -{{ reap_after_days | int * 1440 }} -print -quit 2>/dev/null)" ]; then
            continue
          fi
          sz=$(du -sh "$d" 2>/dev/null | cut -f1)
          rm -rf "$d" && reaped="$reaped $d($sz)"
        done
        echo "reaped:${reaped:- none}"
        df -h / | tail -1
      args:
        executable: /bin/bash
      become: true
      register: reap_out
      changed_when: "'reaped: none' not in reap_out.stdout"
      tags: [reap, report]

    - name: Say what was reaped
      ansible.builtin.debug:
        msg: "{{ reap_out.stdout_lines }}"
      tags: [reap, report]

# ---- report ----------------------------------------------------------------------
    - name: Fetch test results to control machine
      ansible.builtin.fetch:
        src: "{{ item }}"
        dest: "{{ playbook_dir }}/artifacts/"
        fail_on_missing: false
      loop:
        - "{{ test_results }}"
        - "{{ clippy_results }}"
        - "{{ smoke_results }}"
        - /tmp/pvfsd-journal.txt
      tags: [report]

    # D91 — the summary used to read `test_out.stdout_lines[-1]`, and the LAST
    # `test result:` line of a cargo run is always the final crate's doc-tests,
    # which are empty. So a fully green run reported "0 passed; 0 failed" and
    # exited 0 — a recap that says nothing happened is worse than no recap,
    # because it gets believed. Aggregate every suite instead.
    - name: Aggregate real test totals
      ansible.builtin.shell: |
        set -o pipefail
        awk -F'[ ;]+' '/^test result:/{p+=$4; f+=$6; i+=$8; n++}
                       END {if (n==0) print "NO SUITES RAN — suspect a stale build";
                            else printf "%d passed, %d failed, %d ignored (%d suites)", p, f, i, n}' \
          {{ test_results }}
      args:
        executable: /bin/bash
      register: test_totals
      changed_when: false
      failed_when: false
      tags: [report]

    - name: Pipeline summary
      ansible.builtin.debug:
        msg:
          - "build   : ok"
          # Honest about not having run. A recap that claims a check passed
          # when it was skipped is worse than omitting it — that is the same
          # failure as the "0 passed; 0 failed" recap D91 fixed below.
          - "clippy  : {{ 'clean (-D warnings, --all-targets)' if clippy_out is defined and not clippy_out.skipped | default(false) else 'NOT RUN in this invocation' }}"
          - "tests   : {{ test_totals.stdout | default('see artifacts') }}"
          - "smoke   : {{ smoke_out.stdout_lines | default([]) | select('match', '^smoke results') | list | last | default('see artifacts') }}"
          - "binary  : {{ version_out.stdout | default('n/a') }}"
          - "daemon  : {{ daemon_info2.stdout | default('not run') }}"
      tags: [report]
