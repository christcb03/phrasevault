# D95 — a dropped SSH connection used to hang the pipeline FOREVER.
#
# Seen 2026-08-30: `cargo test` finished on the build host and wrote its
# results, the connection died before ansible collected them, and the playbook
# sat waiting for nearly two hours with the target completely idle. No output,
# no error, no timeout — indistinguishable from a slow build unless you go and
# look at the host, which is exactly the failure mode you cannot afford in the
# thing you use to decide whether a build is good.
#
# ServerAliveInterval/CountMax make the client notice a dead peer in ~60s
# instead of never. ControlPersist keeps the win of connection reuse.
[defaults]
timeout = 30
host_key_checking = True

[ssh_connection]
ssh_args = -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
