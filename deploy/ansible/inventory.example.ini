# Copy to inventory.ini and set your target host.
# inventory.ini is gitignored — do not commit hostnames, IPs, or credentials.
# Group name must match pipeline.yml (default: pvfs_hosts), or pass -e target_hosts=your_group

[pvfs_hosts]
pvfs-test ansible_host=<host> ansible_user=<user>
# D132 — a second, identical build VM should NOT run the suite: it builds and
# installs (what the two-box lab pairs need) while one host runs the tests,
# clippy and smoke. Two identical VMs on one storage backend running the same
# suite at once slowed both about 2x and proved nothing the first did not.
# pvfs-build-only ansible_host=<host2> ansible_user=<user> pvfs_runs_suite=false

[pvfs_hosts:vars]
ansible_python_interpreter=/usr/bin/python3
# Optional if your key is not the default:
# ansible_ssh_private_key_file=~/.ssh/id_ed25519
