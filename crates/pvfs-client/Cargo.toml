[package]
name = "pvfs-client"
description = "PVFS daemon client — connect to a forest's pvfsd over a Unix socket (doc 07)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
pvfs-core = { path = "../pvfs-core" }
pvfs-proto = { path = "../pvfs-proto" }
# punch E: the shared watcher loop (live indexing of bound folders)
notify.workspace = true
blake3.workspace = true
hex.workspace = true
# F1 network transport (doc 17 §4): TLS connect pinned to the instance's
# certificate hash — no CA, no roots.
rustls.workspace = true
# D86: flock for `serve.lock` — a watcher's liveness, released by the kernel
# when it dies, so a crash cannot leave a lock that blocks every later start.
nix.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
rusqlite.workspace = true
