[package]
name = "pvfs-core"
description = "PVFS P0 core engine (kernel): nodes, links, event log, projection, identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# PVOS D222 — every line through one log record (levels, event names, fields).
# The CLI never sets the logger up, so its lines read as they always did.
pvfs-log = { path = "../pvfs-log" }
blake3.workspace = true
k256.workspace = true
chacha20poly1305.workspace = true
bip39.workspace = true
bip32.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
hex.workspace = true
rand.workspace = true
uuid.workspace = true
nix = { workspace = true, features = ["user", "fs", "dir"] }

[dev-dependencies]
tempfile.workspace = true
rusqlite.workspace = true
# D86: the fold-lock tests hold the lock from a second thread the way another
# process would, so they need flock directly.
nix = { workspace = true, features = ["fs"] }
