[package]
name = "pvfsd"
description = "PVFS per-user daemon — serves a forest over a Unix socket (doc 07)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "pvfsd"
path = "src/lib.rs"

[[bin]]
name = "pvfsd"
path = "src/main.rs"

[dependencies]
pvfs-core = { path = "../pvfs-core" }
# P5.1 (doc 18 §5): the daemon's `follow` job runs pvfs-client's shared
# follower loop — the daemon is a *client* of the replica's source.
pvfs-client = { path = "../pvfs-client" }
pvfs-proto = { path = "../pvfs-proto" }
blake3.workspace = true
hex.workspace = true
rand.workspace = true
clap.workspace = true
# `signal` for graceful SIGTERM/SIGINT shutdown (doc 08 §4 item 4); feature
# unification adds it on top of the workspace's user/fs features.
nix = { workspace = true, features = ["signal"] }
# F1 network transport (doc 17 §4): TLS listener with a generated instance
# cert; clients pin the cert hash, no CA involved.
rustls.workspace = true
rustls-pemfile.workspace = true
rcgen.workspace = true

[dev-dependencies]
pvfs-client = { path = "../pvfs-client" }
tempfile.workspace = true
hex.workspace = true
