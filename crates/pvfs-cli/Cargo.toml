[package]
name = "pvfs-cli"
description = "Thin CLI over pvfs-core (spec §13.4)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "pvfs"
path = "src/main.rs"

[dependencies]
pvfs-core = { path = "../pvfs-core" }
pvfs-client = { path = "../pvfs-client" }
pvfs-companion = { path = "../pvfs-companion" }
clap.workspace = true
hex.workspace = true
serde_json.workspace = true
notify = "6"

[target.'cfg(target_os = "linux")'.dependencies]
# P7.3 (doc 20 §3): the FUSE streaming mount is Linux-only for now — macOS
# would need macFUSE; the commands are cfg-gated with it.
pvfs-fuse = { path = "../pvfs-fuse" }
