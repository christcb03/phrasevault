[package]
name = "pvfs-cli"
description = "Thin CLI over pvfs-core (spec §13.4)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "pvfs"
path = "src/main.rs"

[dependencies]
pvfs-core = { path = "../pvfs-core" }
pvfs-client = { path = "../pvfs-client" }
pvfs-companion = { path = "../pvfs-companion", default-features = false }
# `signal` to give SIGPIPE its default disposition in main — a pipeline filter
# dies quietly when its reader exits (`pvfs ls | head`); feature unification
# adds it on top of the workspace's user/fs features.
nix = { workspace = true, features = ["signal"] }
clap.workspace = true
hex.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# P7.3 (doc 20 §3): the FUSE streaming mount is Linux-only for now — macOS
# would need macFUSE; the commands are cfg-gated with it.
pvfs-fuse = { path = "../pvfs-fuse" }

[features]
# D69: the OS-keychain backend (keyring -> libdbus) cannot cross-compile
# to aarch64-musl for the NAS; default stays ON for native builds, the
# cross-build passes --no-default-features (file-vault custody only).
default = ["os-keychain"]
os-keychain = ["pvfs-companion/os-keychain"]
