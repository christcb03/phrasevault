[workspace]
members = [
    "crates/pvfs-core",
    "crates/pvfs-cli",
    "crates/pvfs-proto",
    "crates/pvfs-client",
    "crates/pvfsd",
    "crates/pvfs-companion",
]
resolver = "2"

[workspace.package]
version = "1.2.0"
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
blake3 = "1.5"
sha2 = "0.10"
k256 = { version = "0.13", features = ["ecdh"] }
bip39 = { version = "2.1", features = ["rand"] }
bip32 = "0.5"
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1"
hex = "0.4"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
nix = { version = "0.29", features = ["user", "fs"] }
clap = { version = "4.4", features = ["derive"] }
tempfile = "3"
# Companion web-agent TLS (PVOS M3.6 §4a — close the loopback-exception
# reliance): rustls with the ring provider (aws-lc-sys wants cmake; the
# pipeline hosts don't have it), rcgen for the localhost cert.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rustls-pemfile = "2"
rcgen = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Companion key vault (doc 14 §5): Argon2id KDF + XChaCha20-Poly1305 AEAD, with
# zeroizing key material.
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = "1"
